          readOnly: true
        numero:
          type: string
          title: Número de solicitud
          maxLength: 50
        observaciones:
          type: string
        equipos:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
      required:
      - id
      - numero
    Equipo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        no_inventario:
          type: string
          readOnly: true
          title: Número de inventario
        tipo_recurso:
          type: integer
          readOnly: true
        tipo_recurso_nombre:
          type: string
          readOnly: true
        marca:
          type: string
          readOnly: true
        modelo:
          type: string
          readOnly: true
        no_serie:
          type: string
          readOnly: true
          title: Número de serie
        departamento:
