          readOnly: true
          title: Centro de costo
        area:
          type: integer
          readOnly: true
        area_nombre:
          type: string
          readOnly: true
        sede_nombre:
          type: string
          readOnly: true
      required:
      - area
      - area_nombre
      - centro_costo
      - id
      - nombre
      - sede_nombre
      - tipo
    EditarSolicitudBaja:
      type: object
