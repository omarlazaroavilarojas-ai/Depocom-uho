components:
  schemas:
    AccionEnum:
      enum:
      - creacion
      - edicion
      - revision
      - presentacion
      - aprobacion_area
      - rechazo_area
      - aprobacion_tecnica
      - remision_economia
      - inicio_economia
      - aprobacion_economia
      - recepcion_deposito
      type: string
      description: |-
        * `creacion` - Creación
        * `edicion` - Edición
        * `revision` - Revisión técnica
        * `presentacion` - Presentación
        * `aprobacion_area` - Aprobación del Área
        * `rechazo_area` - Rechazo del Área
        * `aprobacion_tecnica` - Aprobación técnica
        * `remision_economia` - Remisión a Economía
        * `inicio_economia` - Inicio del proceso económico
        * `aprobacion_economia` - Aprobación económica
        * `recepcion_deposito` - Recepción en depósito
    CondicionFisicaEnum:
      enum:
      - buena
      - regular
      - mala
      - no_evaluada
      type: string
      description: |-
        * `buena` - Buena
        * `regular` - Regular
        * `mala` - Mala
        * `no_evaluada` - No evaluada
    CrearSolicitudBaja:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        numero:
          type: string
