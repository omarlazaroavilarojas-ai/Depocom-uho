        observaciones:
          type: string
        equipos:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
      required:
      - equipos
      - id
      - numero
    Departamento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
