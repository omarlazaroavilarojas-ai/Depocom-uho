        nombre:
          type: string
          maxLength: 150
        descripcion:
          type: string
          title: Descripción
        cantidad:
          type: integer
          maximum: 2147483647
          minimum: 0
        estado:
          $ref: '#/components/schemas/PiezaDepositoEstadoEnum'
        estado_nombre:
          type: string
          readOnly: true
        ubicacion:
          type: string
          title: Ubicación en el depósito
